name: CI Bootstrap

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-bootstrap-master
  cancel-in-progress: true

jobs:
  verify-current-master:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current master
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate JavaScript assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find app/src/main/assets -type f -name '*.js' -print0)

      - name: Run unit tests
        run: ./gradlew --stacktrace app:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --stacktrace app:lintDebug

      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ChromeXt_bootstrap_lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug and release APKs
        run: ./gradlew --stacktrace app:assembleDebug app:assembleRelease

      - name: Prepare APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk app/build/ChromeXt_debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/ChromeXt_release_unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ChromeXt_bootstrap_debug
          path: app/build/ChromeXt_debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: ChromeXt_bootstrap_release_unsigned
          path: app/build/ChromeXt_release_unsigned.apk
          if-no-files-found: error
          retention-days: 30
