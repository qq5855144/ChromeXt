name: Android CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate JavaScript assets
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find app/src/main/assets -type f -name '*.js' -print0)

      - name: Run unit tests
        run: ./gradlew --stacktrace app:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --stacktrace app:lintDebug

      - name: Build debug APK
        run: ./gradlew --stacktrace app:assembleDebug

      - name: Rename debug APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/ChromeXt_debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChromeXt_debug
          path: app/build/ChromeXt_debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag') }}
        run: ./gradlew --stacktrace app:assembleRelease

      - name: Prepare release APK
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag') }}
        run: mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/ChromeXt.apk

      - name: Sign release APK
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag') }}
        uses: noriban/sign-android-release@master
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed release APK
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag') }}
        uses: actions/upload-artifact@v4
        with:
          name: ChromeXt_signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: error
          retention-days: 30
