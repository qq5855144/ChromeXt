name: Android CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate JavaScript assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find app/src/main/assets -type f -name '*.js' -print0)

      - name: Run unit tests
        run: ./gradlew --stacktrace app:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --stacktrace app:lintDebug

      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ChromeXt_lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug and release APKs
        run: ./gradlew --stacktrace app:assembleDebug app:assembleRelease

      - name: Prepare APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk app/build/ChromeXt_debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/ChromeXt_release_unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ChromeXt_debug
          path: app/build/ChromeXt_debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: ChromeXt_release_unsigned
          path: app/build/ChromeXt_release_unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check release signing configuration
        id: signing
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_KEY" && -n "$SIGNING_ALIAS" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are incomplete; keeping the verified unsigned release artifact."
          fi

      - name: Prepare release APK for signing
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/ChromeXt.apk

      - name: Sign tagged release APK
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        uses: noriban/sign-android-release@v5.1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed release APK
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ChromeXt_signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: error
          retention-days: 30
