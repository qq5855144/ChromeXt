name: Android CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  quality:
    name: Quality and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate userscript runtime assets
        run: |
          node --check app/src/main/assets/GM.js
          node --check app/src/main/assets/GM_compat.js
          node scripts/verify-userscript-runtime.mjs

      - name: Kotlin formatting check
        run: ./gradlew --stacktrace ktfmtCheck :app:ktfmtCheck

      - name: Run unit tests
        run: ./gradlew --stacktrace :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --stacktrace :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChromeXt-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Release APK
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_CONFIGURED: ${{ secrets.SIGNING_KEY != '' && secrets.ALIAS != '' && secrets.KEY_STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Sign release APK
        if: env.SIGNING_CONFIGURED == 'true'
        id: sign_app
        uses: noriban/sign-android-release@0330517de429fdf756daf71ac03c342edf341a54
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed release APK
        if: env.SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ChromeXt-release-signed-${{ github.ref_name }}
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        if: env.SIGNING_CONFIGURED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ChromeXt-release-unsigned-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
